name: CI
on:
  push:
  pull_request:
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: node scripts/build-site.mjs
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: swift package --disable-sandbox dump-package
        working-directory: native/ios
